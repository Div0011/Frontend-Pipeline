name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  superfan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/superfan-redesign
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: projects/superfan-redesign/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps
      - run: npx playwright test --project=chromium-desktop

  pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -v || true
