# Autonomous Website Redesign Platform — local infrastructure
# Brings up Postgres (checkpointer + long-term store + app schema) and Redis
# (pub/sub for live progress + job queue). The API runs in Docker too, or you
# can run it locally against these services.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: redesign
      POSTGRES_PASSWORD: redesign
      POSTGRES_DB: redesign
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redesign"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      POSTGRES_DSN: postgresql://pipeline:redesign@postgres:5432/redesign
      REDIS_URL: redis://redis:6379/0
      LLM_PROVIDER: ${LLM_PROVIDER:-simulation}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      HUMAN_APPROVAL_ENABLED: ${HUMAN_APPROVAL_ENABLED:-false}
    ports:
      - "8000:8000"
    command: uvicorn pipeline.api.main:app --host 0.0.0.0 --port 8000

volumes:
  pgdata:
