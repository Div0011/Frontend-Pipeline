            - paragraph [ref=f7e198]: Getreu dem Prinzip „Weniger ist mehr“, richtet sich unsere Küche unter der Leitung von Peter Hagen-Wiest nach klaren und natürlichen Aromen, die das Urprodukt im Fokus belassen. Bei uns steht der Geschmack im Vordergrund – ohne Spielereien. Dabei legen die Liebe zum Handwerk, zum Detail und eine präzise Arbeitsweise den Grundstein für ein Menü, das beständig neue Impulse setzt.
