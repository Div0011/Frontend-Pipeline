          - heading "OUR NAME" [level=2] [ref=f10e124]
          - paragraph [ref=f10e125]: The Rosewater name was inspired by the fictional lead character, Eliot Rosewater, from Kurt Vonnegut’s classic “God Bless You Mr. Rosewater” who chose to forgo his family fortune in favor of spreading kindness in his small hometown.
        - generic [ref=f10e136]:
          - paragraph [ref=f10e137]: “Hello babies. Welcome to Earth. It’s hot in the summer and cold in the winter. It’s round and wet and crowded. On the outside, babies, you’ve got a hundred years here. There's only one rule that I know of, babies – God damn it, you've got to be kind.”
          - heading "– Kurt vonnegut –" [level=4] [ref=f10e138]
