  - main [ref=f10e28]:
    - article [ref=f10e29]:
      - paragraph [ref=f10e41]: It’s true, we sell delicious handmade food, quality spirits, and thoughtful specialty groceries & gifts. But our true mission is to spread kindness – to make you feel something, not just buy something. So stop by to grab a chicken sandwich & a smile.
      - heading "Kindness is a gift everyone can afford to give." [level=2] [ref=f10e55]
      - generic [ref=f10e69]:
        - heading "ROSEWATER MARKET" [level=3] [ref=f10e70]
        - paragraph [ref=f10e71]: We serve thoughtfully-crafted food-to-go, from scratch-made baked goods, to breakfast & lunch favorites, to a vast selection of hot and cold drinks. Available year-round at our historic Summer St. storefront.
        - heading [level=4] [ref=f10e72]
      - generic [ref=f10e84]:
        - heading "ROSEWATER SPIRITS" [level=3] [ref=f10e85]
        - paragraph [ref=f10e86]: We offer an intoxicating selection of wines, spirits and beers; along with provisions for every occasion all served up by a friendly staff dedicated to helping you discover a new favorite. Visit us all season on Main St.
        - heading [level=4] [ref=f10e87]
