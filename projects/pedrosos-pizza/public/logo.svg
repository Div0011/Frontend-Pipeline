<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- Outer Black Background -->
  <rect width="400" height="400" fill="#0A0A0A" />
  
  <!-- Outer Red Thick Ring -->
  <circle cx="200" cy="200" r="176" stroke="#D91C24" stroke-width="22" fill="#0A0A0A" />
  
  <!-- Inner Yellow Thin Ring -->
  <circle cx="200" cy="200" r="150" stroke="#F2C777" stroke-width="5" fill="none" />
  
  <!-- Top Curved Text: FRESH 'N' HOT -->
  <path id="topCurve" d="M 90 200 A 110 110 0 0 1 310 200" fill="none" />
  <text fill="#F2C777" font-family="'Space Grotesk', 'Impact', sans-serif" font-size="18" font-weight="900" letter-spacing="4">
    <textPath href="#topCurve" startOffset="50%" text-anchor="middle">FRESH 'N' HOT</textPath>
  </text>
  
  <!-- Pedroso's Script in Gold/Yellow -->
  <g transform="translate(45, 110)">
    <!-- Script Shadow -->
    <text x="155" y="62" fill="#8B6914" font-family="'Brush Script MT', 'Snell Roundhand', 'Pacifico', cursive, sans-serif" font-size="76" font-weight="bold" font-style="italic" text-anchor="middle">Pedroso's</text>
    <!-- Script Main -->
    <text x="152" y="58" fill="#F2C777" font-family="'Brush Script MT', 'Snell Roundhand', 'Pacifico', cursive, sans-serif" font-size="76" font-weight="bold" font-style="italic" text-anchor="middle">Pedroso's</text>
    <!-- Pizza cutter handle in red -->
    <path d="M250 20 L275 0 L285 10 L260 30 Z" fill="#D91C24" />
  </g>
  
  <!-- Middle Red Block PIZZA -->
  <text x="200" y="260" fill="#D91C24" font-family="'Impact', 'Space Grotesk', sans-serif" font-size="78" font-weight="900" text-anchor="middle" letter-spacing="6" stroke="#0A0A0A" stroke-width="2">PIZZA</text>
  
  <!-- Bottom Curved Text: SQUARE OR NOT -->
  <path id="bottomCurve" d="M 80 200 A 120 120 0 0 0 320 200" fill="none" />
  <text fill="#FFFFFF" font-family="'Space Grotesk', 'Impact', sans-serif" font-size="17" font-weight="900" letter-spacing="4">
    <textPath href="#bottomCurve" startOffset="50%" text-anchor="middle">SQUARE OR NOT</textPath>
  </text>
</svg>